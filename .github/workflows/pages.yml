# Publishes the website (site/, built by tools/build_site.py) with GitHub Pages (D-O-015), and the official package of
# the current version (tools/build_release.py, D-O-024).
# In the repository: Settings → Pages → Source « GitHub Actions ».
name: Site web
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/releases/**", "core/__init__.py"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 0.60.97 (D-O-103): every action pinned to a commit (a moved tag cannot change what builds the package that servers
    # install); the comment gives the release. The checkout keeps no token: the build only reads.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # 0.60.12 (D-O-024): the official package of the version and updates/versions.json (read by versions.html)
      - run: python3 tools/build_release.py --out site/updates
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4.0.0: its own upload-artifact is pinned too (v3.0.1 used @v4, refused)
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
