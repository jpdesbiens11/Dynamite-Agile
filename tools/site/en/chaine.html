  <section id="chaine" class="chain reveal">

    <p class="sub">From the customer's need to the test that proves it, every link is a link, not a copy. A Word or CSV extract shows it to the customer.</p>
    <svg viewBox="0 0 1180 230" role="img" aria-label="Need, Function, Requirement, Task, Test, Verified">
      <g id="links">
        <path class="link" d="M170 110 C210 60 230 160 270 110"/><path class="link" d="M440 110 C480 60 500 160 540 110"/>
        <path class="link" d="M710 110 C750 60 770 160 810 110"/><path class="link" d="M980 110 C1000 70 1010 150 1020 110"/>
      </g>
      <g class="node"><rect x="10" y="60" width="160" height="100" rx="14"/><text x="30" y="100">Need</text><text class="sm" x="30" y="128">client · Need Status</text></g>
      <g class="node"><rect x="270" y="60" width="170" height="100" rx="14"/><text x="290" y="100">Function</text><text class="sm" x="290" y="128">tree · F-XX</text></g>
      <g class="node"><rect x="540" y="60" width="170" height="100" rx="14"/><text x="560" y="100">Requirement</text><text class="sm" x="560" y="128">Spec (CdCF) · IADT</text></g>
      <g class="node"><rect x="810" y="60" width="170" height="100" rx="14"/><text x="830" y="100">Task → Test</text><text class="sm" x="830" y="128">implements · TST</text></g>
      <g class="node"><rect x="1020" y="60" width="150" height="100" rx="14" style="fill:#dcf7e6"/><text x="1040" y="100">Verified ✓</text><text class="sm" x="1040" y="128">Verification Ref.</text></g>
      <circle class="spark" r="7"><animateMotion dur="5s" repeatCount="indefinite" path="M90 110 C210 60 230 160 355 110 C480 60 500 160 625 110 C750 60 770 160 895 110 C1000 70 1010 150 1095 110"/></circle>
    </svg>
  </section>
